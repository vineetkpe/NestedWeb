name: Format debug

on:
  push:
    branches: [feat/single-scan-orchestration]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npx prettier --write src/application/single-scan.ts src/application/single-scan.test.ts
      - name: Print formatted files
        run: |
          echo '--- SINGLE_SCAN_TS_BEGIN ---'
          cat src/application/single-scan.ts
          echo '--- SINGLE_SCAN_TS_END ---'
          echo '--- SINGLE_SCAN_TEST_TS_BEGIN ---'
          cat src/application/single-scan.test.ts
          echo '--- SINGLE_SCAN_TEST_TS_END ---'
